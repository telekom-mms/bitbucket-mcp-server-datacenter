name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run tests
        run: uv run --locked pytest -q
      - name: Test release automation
        run: node --test .github/scripts/*.test.cjs
      - name: Build distributions
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false # no lockfile checked out in this job
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release after successful PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          releases=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')
          if ! printf '%s\n' "$releases" | grep -Fxq "$TAG"; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
